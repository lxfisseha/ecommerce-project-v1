{% extends "base.html" %}

{% block content %}
<div class="flex h-screen bg-bg-main overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-bg-alt border-r border-border-main flex-col hidden md:flex md:static transition-transform duration-300 transform -translate-x-full md:translate-x-0">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-full bg-bg-muted border border-border-main"></div>
                <div>
                    <h3 class="font-bold text-text-main text-sm">Seller Hub</h3>
                    <p class="text-text-muted text-xs">Merchant Portal</p>
                </div>
            </div>

            <nav class="space-y-1">
                <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if request.url.path in ['/dashboard', '/dashboard/'] %}bg-primary text-white{% else %}text-text-muted hover:bg-bg-muted{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span>Dashboard</span>
                </a>
                <a href="/dashboard/products" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if '/products' in request.url.path %}bg-primary text-white{% else %}text-text-muted hover:bg-bg-muted{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                    <span>Inventory</span>
                </a>
                <a href="/dashboard/orders" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if '/orders' in request.url.path %}bg-primary text-white{% else %}text-text-muted hover:bg-bg-muted{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span>Orders</span>
                </a>
                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if request.url.path == '/' %}bg-primary text-white{% else %}text-text-muted hover:bg-bg-muted{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span>Shop</span>
                </a>
                <a href="/dashboard/profile" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if '/profile' in request.url.path %}bg-primary text-white{% else %}text-text-muted hover:bg-bg-muted{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span>Settings</span>
                </a>
                <a href="/support" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if request.url.path == '/support' %}bg-primary text-white{% else %}text-text-muted hover:bg-bg-muted{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span>Support</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- Overlay for mobile menu -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Nav -->
        <header class="h-16 bg-bg-main border-b border-border-main flex items-center justify-between px-4 sm:px-8">
            <div class="flex items-center gap-4">
                <button class="md:hidden p-2 text-primary" onclick="toggleSidebar()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <span class="text-xl sm:text-2xl font-bold text-primary">E-Mart</span>
            </div>
            <div class="flex items-center gap-4 sm:gap-6">
                <div class="flex gap-2 items-center">
                    <a href="/dashboard/profile" class="p-2 text-primary hover:bg-bg-muted rounded-full" title="Profile">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                    <a href="/auth/logout" class="ml-2 px-3 py-1.5 border border-border-main rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition" title="Logout">
                        Logout
                    </a>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto bg-white">
            <div class="p-4 sm:p-8">
                {% block seller_content %}{% endblock %}
            </div>
        </main>
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('hidden');
        sidebar.classList.toggle('-translate-x-full');
        sidebar.classList.toggle('flex');
        overlay.classList.toggle('hidden');
    }
</script>
{% endblock %}

{% block footer %}{% endblock %}
