<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AleMart{% endblock %}</title>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .blur-decoration { pointer-events: none; z-index: -1; }
        [hx-headers] { cursor: pointer; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-[#f8f9fa] min-h-screen relative overflow-x-hidden flex flex-col">

    <!-- Global Background Decorations -->
    <div class="blur-decoration absolute -top-24 -left-32 w-[512px] h-[410px] bg-[#00685f0d] rounded-full blur-[100px]"></div>
    <div class="blur-decoration absolute bottom-0 -right-32 w-[512px] h-[410px] bg-[#0058be0d] rounded-full blur-[100px]"></div>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="bg-[#e1e3e4] border-t border-[#bcc9c6] py-8 px-6 mt-auto">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-col md:flex-row items-center gap-2 md:gap-4 text-center md:text-left">
                <span class="font-semibold text-lg text-[#191c1d]">AleMart</span>
                <span class="text-[#3d4947] text-sm">© 2024 EthiopiaMarket. Reliability in Commerce.</span>
            </div>
            <div class="flex gap-6">
                <a href="#" class="text-[#3d4947] text-sm hover:text-[#00685f]">Terms of Service</a>
                <a href="#" class="text-[#3d4947] text-sm hover:text-[#00685f]">Privacy Policy</a>
                <a href="#" class="text-[#3d4947] text-sm hover:text-[#00685f]">Seller Guidelines</a>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
