{% extends "base.html" %}

{% block content %}
<!-- Top Navigation (Header) -->
<header class="h-16 bg-[#f8f9fa] border-b border-[#bcc9c6] px-4 sm:px-8 flex items-center justify-between sticky top-0 z-50">
    <!-- Left: Logo -->
    <div class="flex-1">
        <a href="/" class="text-lg sm:text-2xl font-bold text-[#00685f] whitespace-nowrap">AleMart</a>
    </div>

    <!-- Center: Navigation -->
    <div class="flex-1 flex justify-center">
        <a href="/" class="text-[#3d4947] hover:text-[#00685f] text-sm font-medium transition-colors">Shop</a>
    </div>

    <!-- Right: Actions -->
    <div class="flex-1 flex justify-end items-center gap-2 sm:gap-4">
        <!-- Seller Login Button -->
        <a href="/auth/login" class="px-4 py-2 bg-[#00685f] text-white rounded-lg text-sm font-medium hover:bg-[#005a54] transition-colors">
            Seller Hub
        </a>

        <!-- Mobile Menu Toggle (Hamburger) -->
        <button class="md:hidden p-2 text-[#3d4947]" onclick="toggleMobileMenu()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>
</header>

<!-- Mobile Menu Overlay -->
<div id="mobile-menu" class="fixed inset-0 z-40 hidden md:hidden">
    <div class="absolute inset-0 bg-black/20 backdrop-blur-sm" onclick="toggleMobileMenu()"></div>
    <div class="absolute top-16 right-4 left-4 bg-white rounded-2xl border border-[#bcc9c6] shadow-xl p-6 animate-in slide-in-from-top-4">
        <nav class="flex flex-col gap-4">
            <a href="/" class="text-[#00685f] font-semibold text-lg">Shop</a>
            <hr class="border-t border-[#bcc9c6]">
            <a href="/auth/login" class="flex items-center justify-center py-3 bg-[#f3f4f5] text-[#191c1d] font-bold rounded-xl border border-[#bcc9c6]">
                Merchant Access
            </a>
        </nav>
    </div>
</div>

<!-- Main Buyer Content -->
<div class="flex-grow">
    {% block buyer_content %}{% endblock %}
</div>

<!-- Mobile Bottom Navigation (Matching Figma 4:4357) -->
{% block mobile_footer %}
<footer class="md:hidden sticky bottom-0 z-40 bg-[#f8f9fa] border-t border-[#bcc9c6] flex justify-around items-center h-16 px-4">
    <a href="/" class="flex flex-col items-center gap-1 text-[#00685f]">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
        <span class="text-[10px] font-medium">Home</span>
    </a>
    <button class="flex flex-col items-center gap-1 text-[#3d4947]">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <span class="text-[10px] font-medium">Search</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-[#3d4947]">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="text-[10px] font-medium">Orders</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-[#3d4947]">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="text-[10px] font-medium">Profile</span>
    </button>
</footer>
{% endblock %}

<script>
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }
</script>
{% endblock %}

{% block footer %}{% endblock %}
