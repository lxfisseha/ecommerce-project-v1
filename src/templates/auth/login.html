{% extends "base.html" %}

{% block title %}Seller Login - AleMart{% endblock %}

{% block content %}
<div class="flex flex-col items-center w-full max-w-[440px]">
    <!-- Logo Branding -->
    <div class="text-center mb-12">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-[#00685f] rounded-xl shadow-sm mb-4">
            <svg width="34" height="30" viewBox="0 0 34 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 0L33.4545 29.25H0.545517L17 0Z" fill="white"/>
            </svg>
        </div>
        <h1 class="text-[#00685f] text-[32px] font-semibold tracking-[-0.32px] leading-10">AleMart</h1>
        <p class="text-[#3d4947] text-base leading-6 mt-1">Merchant Solution Center</p>
    </div>

    <!-- Auth Container -->
    <div class="w-full bg-white rounded-xl border border-[#bcc9c6] shadow-sm p-8">
        {% include "auth/login_partial.html" %}
    </div>

    <!-- Trust Badges -->
    <div class="mt-8 flex justify-center gap-6 w-full text-[#191c1d]">
        <div class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"></path></svg>
            <span class="text-base leading-6">Secure AES Encryption</span>
        </div>
        <div class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.588a1 1 0 01.788 0l4 1.588c.124.05.238.132.34.239l2.406-.918a1 1 0 000-1.84l-7-3zM2 9.135V16.33a2 2 0 001.233 1.84l5 2.25a1 1 0 00.767 0l5-2.25a2 2 0 001.233-1.84V9.135l-5 2.25a1 1 0 01-.767 0l-5-2.25z"></path></svg>
            <span class="text-base leading-6">Official Seller Hub</span>
        </div>
    </div>
</div>
{% endblock %}
