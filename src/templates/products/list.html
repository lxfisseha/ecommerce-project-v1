{% extends "seller_base.html" %}

{% block title %}Product Management - Merchies{% endblock %}

{% block seller_content %}
<div>
    <!-- Header Action Row -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
            <h1 class="text-2xl sm:text-[32px] font-semibold text-text-main leading-tight sm:leading-10 tracking-[-0.32px]">Product Management</h1>
        </div>
        <a href="/dashboard/products/add" class="inline-flex w-full sm:w-auto items-center justify-center gap-2 px-6 py-3 bg-primary text-white rounded-lg font-medium text-sm transition-colors hover:bg-primary-hover">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 1V13M1 7H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Add New Product
        </a>
    </div>

    <!-- Search Bar -->
    <div class="relative mb-6 group">
        <input type="text"
               name="search"
               value="{{ search if search else '' }}"
               placeholder="Search products..."
               class="w-full pl-12 pr-4 py-3 bg-white border border-border-main rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm"
               hx-get="/dashboard/products"
               hx-trigger="keyup changed delay:500ms, search"
               hx-target="#product-list-content"
               hx-swap="outerHTML"
               hx-push-url="true"
               hx-indicator="#grid-indicator, #search-loading">
        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-text-muted">
            <svg id="search-icon" class="w-5 h-5 opacity-40 group-focus-within:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
        <div id="search-loading" class="absolute right-4 top-1/2 -translate-y-1/2 htmx-indicator">
            <svg class="animate-spin h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </div>

    {% include "products/_product_list_content.html" %}
</div>
{% endblock %}
