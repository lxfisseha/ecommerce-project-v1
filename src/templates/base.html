<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AleMart{% endblock %}</title>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#333333',
                            hover: '#1F1F1F',
                        },
                        accent: '#C99940',

                        danger: '#C44536',
                        success: {
                            DEFAULT: '#4F8A65',
                            dark: '#3A694B',
                            light: '#EDF5F0'
                        },
                        info: {
                            DEFAULT: '#407899',
                            dark: '#2E5A73',
                            light: '#4C8BC4'
                        },
                        text: {
                            main: '#2B2624',
                            muted: '#524B48',
                            light: '#7A736F',
                        },
                        bg: {
                            main: '#FAF9F8',
                            alt: '#F5F3F1',
                            muted: '#E8E5E3',
                            hover: '#F0ECE9',
                        },
                        border: {
                            main: '#D0CBC7',
                            dark: '#B5B0AD'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
        .blur-decoration { pointer-events: none; }
        [hx-headers] { cursor: pointer; }
        
        /* Specific weights from Figma */
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .font-regular { font-weight: 400; }

        /* HTMX Indicator Helpers */
        .htmx-indicator {
            display: none !important;
        }
        .htmx-request .htmx-indicator {
            display: flex !important;
        }
        .htmx-request.htmx-indicator {
            display: flex !important;
        }
        .htmx-request .htmx-hide-on-request {
            display: none !important;
        }

        /* Hide scrollbar but keep scrolling */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-bg-main min-h-screen relative overflow-x-hidden flex flex-col">

    <!-- Global Background Decorations -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-[-1]">
        <div class="blur-decoration absolute -top-[102px] -left-[128px] w-[512px] h-[410px] bg-primary/5 rounded-full blur-[100px]"></div>
        <div class="blur-decoration absolute bottom-0 -right-[128px] w-[512px] h-[410px] bg-info-dark/5 rounded-full blur-[100px]"></div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    {% block footer %}
    <footer class="bg-bg-muted border-t border-border-main py-8 px-6 mt-auto">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-col md:flex-row items-center gap-2 md:gap-4 text-center md:text-left">
                
                <span class="text-text-muted text-sm"></span>
            </div>

        </div>
    </footer>
    {% endblock %}

    {% block scripts %}
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRF-Token'] = '{{ csrf_token }}';
        });

        // Handle error status codes (400, 422, 500 etc) to show validation messages
        document.body.addEventListener('htmx:beforeOnLoad', function (evt) {
            if (evt.detail.xhr.status >= 400) {
                evt.detail.shouldSwap = true;
                evt.detail.target = htmx.find("#auth-container") || evt.detail.target;
            }
        });
    </script>
    {% endblock %}
</body>
</html>
