{% extends "base.html" %}

{% block content %}
<!-- Top Navigation (Header) -->
<header class="h-16 bg-bg-main border-b border-border-main px-4 sm:px-8 flex items-center justify-between sticky top-0 z-50">
    <!-- Left: Logo -->
    <div class="flex-1">
        <a href="/" class="text-lg sm:text-2xl font-bold text-primary whitespace-nowrap"><span class="text-accent">Merchies</span></a>
    </div>

    <!-- Center: Navigation -->
    <div class="flex-1 flex justify-center">
        <nav class="hidden md:flex items-center gap-6 text-text-muted text-sm font-medium">
            <a href="/" class="{% if request.url.path == '/' %}text-primary border-b-2 border-primary pb-1{% else %}hover:text-primary{% endif %}">Home</a>
            <a href="/shop" class="{% if request.url.path == '/shop' %}text-primary border-b-2 border-primary pb-1{% else %}hover:text-primary{% endif %}">Shop</a>
            <a href="/support" class="{% if request.url.path == '/support' %}text-primary border-b-2 border-primary pb-1{% else %}hover:text-primary{% endif %}">Support</a>
        </nav>
    </div>

    <!-- Right: Actions -->
    <div class="flex-1 flex justify-end items-center gap-2 sm:gap-4">
        <!-- Seller Login Button -->
        <a href="/auth/login" class="hidden md:flex px-3 sm:px-4 py-2 bg-primary text-white rounded-lg text-xs sm:text-sm font-medium hover:bg-primary-hover transition-colors whitespace-nowrap">
            Seller Hub
        </a>

        <!-- Mobile Menu Toggle (Hamburger) -->
        <button class="md:hidden p-2 text-primary" onclick="toggleMobileMenu()">
            <svg class="w-6 h-6" fill="" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>
</header>

<div id="mobile-menu" class="fixed inset-0 z-40 hidden md:hidden">
<div class="absolute inset-0 bg-black/20 backdrop-blur-sm" onclick="toggleMobileMenu()"></div>
<div class="absolute top-16 mt-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-sm bg-white rounded-2xl border border-border-main shadow-xl p-6 animate-in slide-in-from-top-4 box-border max-h-[calc(100vh-5rem)] overflow-y-auto overflow-x-hidden">
<nav class="flex flex-col gap-4 w-full">
    <a href="/" class="{% if request.url.path == '/' %}text-primary font-semibold{% else %}text-text-muted font-medium{% endif %} text-lg break-words">Home</a>
    <a href="/shop" class="{% if request.url.path == '/shop' %}text-primary font-semibold{% else %}text-text-muted font-medium{% endif %} text-lg break-words">Shop</a>
    <a href="/support" class="{% if request.url.path == '/support' %}text-primary font-semibold{% else %}text-text-muted font-medium{% endif %} text-lg break-words">Support</a>
    <a href="/auth/login" class="text-text-muted font-medium text-lg break-words">
        Seller Hub
    </a>
</nav>
</div>
</div>
<!-- Main Buyer Content -->
<div class="flex-grow">
    {% block buyer_content %}{% endblock %}
</div>

<!-- Mobile Bottom Navigation -->
{% block mobile_footer %}
<footer class="md:hidden sticky bottom-0 z-40 bg-white/80 backdrop-blur-md border-t border-border-main flex justify-around items-center h-16 px-4">
    <a href="/" class="flex flex-col items-center gap-1 {% if request.url.path == '/' %}text-primary{% else %}text-text-muted{% endif %}">
        <svg class="w-6 h-6" fill="{% if request.url.path == '/' %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span class="text-[10px] font-bold">Home</span>
    </a>
    <a href="/shop" class="flex flex-col items-center gap-1 {% if request.url.path == '/shop' %}text-primary{% else %}text-text-muted{% endif %}">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
        </svg>
        <span class="text-[10px] font-bold">Shop</span>
    </a>
    <a href="/support" class="flex flex-col items-center gap-1 {% if request.url.path == '/support' %}text-primary{% else %}text-text-muted{% endif %}">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span class="text-[10px] font-bold">Support</span>
    </a>
</footer>
{% endblock %}

<script>
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }
</script>
{% endblock %}

{% block footer %}{% endblock %}
