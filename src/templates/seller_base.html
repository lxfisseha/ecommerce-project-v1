{% extends "base.html" %}

{% block content %}
<div class="flex h-screen bg-[#f8f9fa] overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-[#f3f4f5] border-r border-[#bcc9c6] flex-col hidden md:flex md:static transition-transform duration-300 transform -translate-x-full md:translate-x-0">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-full bg-[#e1e3e4] border border-[#bcc9c6]"></div>
                <div>
                    <h3 class="font-bold text-[#191c1d] text-sm">Seller Hub</h3>
                    <p class="text-[#3d4947] text-xs">Merchant Portal</p>
                </div>
            </div>

            <nav class="space-y-1">
                <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if request.url.path == '/dashboard' %}bg-[#2170e4] text-white{% else %}text-[#3d4947] hover:bg-[#e1e3e4]{% endif %}">
                    <span>Dashboard</span>
                </a>
                <a href="/dashboard/products" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium {% if '/products' in request.url.path %}bg-[#2170e4] text-white{% else %}text-[#3d4947] hover:bg-[#e1e3e4]{% endif %}">
                    <span>Inventory</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-[#3d4947] hover:bg-[#e1e3e4]">
                    <span>Sales</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-[#3d4947] hover:bg-[#e1e3e4]">
                    <span>Settings</span>
                </a>
            </nav>
        </div>
        
        <div class="mt-auto p-6">
            <button class="w-full bg-[#00685f] text-white py-2 rounded-lg text-sm font-medium">
                Refresh Data
            </button>
        </div>
    </aside>

    <!-- Overlay for mobile menu -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Nav -->
        <header class="h-16 bg-[#f8f9fa] border-b border-[#bcc9c6] flex items-center justify-between px-4 sm:px-8">
            <div class="flex items-center gap-4">
                <button class="md:hidden p-2 text-[#00685f]" onclick="toggleSidebar()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <span class="text-xl sm:text-2xl font-bold text-[#00685f]">EthiopiaMarket</span>
            </div>
            <div class="flex items-center gap-4 sm:gap-6">
                <nav class="hidden sm:flex gap-6 text-[#3d4947] text-sm font-medium">
                    <a href="/" class="hover:text-[#00685f]">Shop</a>
                    <a href="#" class="hover:text-[#00685f]">Orders</a>
                    <a href="#" class="hover:text-[#00685f]">Support</a>
                </nav>
                <div class="flex gap-2">
                    <button class="p-2 text-[#00685f] hover:bg-[#e1e3e4] rounded-full">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    </button>
                    <button class="p-2 text-[#00685f] hover:bg-[#e1e3e4] rounded-full">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto bg-[#ffffff]">
            <div class="p-4 sm:p-8">
                {% block seller_content %}{% endblock %}
            </div>
        </main>
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        sidebar.classList.toggle('hidden');
        sidebar.classList.toggle('-translate-x-full');
        sidebar.classList.toggle('flex');
        overlay.classList.toggle('hidden');
    }
</script>
{% endblock %}

{% block footer %}{% endblock %}
