{% extends "base.html" %}

{% block title %}Error - AleMart{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center bg-[#f8f9fa] px-4 py-12">
    <div class="max-w-md w-full bg-white p-8 rounded-xl border border-[#bcc9c6] shadow-sm text-center">
        <svg class="w-16 h-16 text-[#ba1a1a] mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <h1 class="text-2xl font-bold text-[#191c1d] mb-2">Oops! Something went wrong</h1>
        <p class="text-[#3d4947] mb-6">{{ error_message | default("An unexpected error occurred. Please try again later.") }}</p>
        <a href="/" class="inline-block px-6 py-2 bg-[#00685f] text-white rounded-lg font-medium hover:bg-[#005a54] transition-colors">
            Return to Home
        </a>
    </div>
</div>
{% endblock %}
