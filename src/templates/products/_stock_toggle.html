<div id="stock-toggle-{{ product.id }}" 
     class="flex items-center gap-2 cursor-pointer relative group" 
     hx-post="/dashboard/products/{{ product.id }}/toggle-stock" 
     hx-target="#stock-toggle-{{ product.id }}" 
     hx-swap="outerHTML"
     hx-indicator="#stock-indicator-{{ product.id }}">
    
    <span class="text-xs font-medium text-[#3d4947]">
        {% if product.in_stock %}In Stock{% else %}Sold Out{% endif %}
    </span>
    
    <div class="relative">
        <div class="w-11 h-6 rounded-full p-1 transition-colors {% if product.in_stock %}bg-[#008378]{% else %}bg-[#e1e3e4]{% endif %}">
            <div class="w-4 h-4 bg-white rounded-full shadow-sm transition-transform {% if product.in_stock %}translate-x-5{% endif %}"></div>
        </div>
        
        <!-- Loading Indicator -->
        <div id="stock-indicator-{{ product.id }}" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-white/50 rounded-full">
            <div class="w-4 h-4 border-2 border-[#00685f] border-t-transparent rounded-full animate-spin"></div>
        </div>
    </div>
</div>

<div id="product-overlay-{{ product.id }}" hx-swap-oob="true" class="absolute inset-0 pointer-events-none">
    {% if not product.in_stock %}
    <div class="absolute inset-0 bg-[#191c1d66] flex items-center justify-center">
        <span class="bg-[#f8f9fa] text-[#191c1d] px-4 py-2 rounded-lg text-sm font-bold">Sold Out</span>
    </div>
    {% endif %}
</div>
