<div id="auth-container" class="animate-in fade-in duration-300">
    <div class="mb-6">
        <a href="/" class="inline-flex items-center gap-2 text-text-muted text-sm font-medium hover:text-primary mb-4">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7.5 9L4.5 6L7.5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Back to Shopping</span>
        </a>
        <h2 class="text-text-main text-2xl font-semibold leading-8">Seller Login</h2>
        <p class="text-text-muted text-base leading-6 mt-1">Enter your registered mobile number to continue.</p>
    </div>

    <!-- Login Form -->
    <form hx-post="/auth/login" hx-target="#auth-container" hx-swap="outerHTML" class="space-y-6">
        {% if csrf_token %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        {% endif %}
        
        <div class="space-y-2">
            <label for="phone" class="block text-text-muted text-sm font-medium leading-4">Phone Number</label>
            <div class="relative flex items-center">
                <span class="absolute left-4 text-text-muted text-base leading-6">
                    +251
                </span>
                <input type="tel" 
                       name="phone" 
                       id="phone" 
                       placeholder="912345678"
                       value="{{ phone or '' }}"
                       required
                       class="w-full pl-14 pr-4 py-[14px] rounded-lg border {% if error %}border-danger{% else %}border-border-main{% endif %} bg-bg-alt text-text-main text-base placeholder-text-light focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
            </div>
            {% if error %}
                <p id="error-message" class="text-danger text-sm mt-1">{{ error }}</p>
            {% endif %}
        </div>

        <button type="submit" 
                class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-medium h-10 rounded-lg shadow-sm flex items-center justify-center gap-2 transition-colors relative disabled:opacity-70 disabled:cursor-not-allowed"
                hx-indicator="#loading-spinner">
            <span class="inline-flex items-center gap-2 htmx-hide-on-request">
                <span>Send OTP</span>
                <svg class="w-[14px] h-[14px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </span>
            <!-- Loading Spinner (Hidden by default) -->
            <div id="loading-spinner" class="htmx-indicator absolute inset-0 flex items-center justify-center">
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </button>
    </form>

</div>
