{% extends "buyer_base.html" %}

{% block title %}Shop - XCollections{% endblock %}

{% block buyer_content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 min-h-screen">
    <!-- Shop Header (Redesigned) -->
    <div class="mb-10 flex flex-col items-start">
        <div class="flex items-center gap-2 mb-2">
            <span class="px-2 py-0.5 bg-accent/10 text-primary rounded-full text-[10px] font-bold tracking-widest uppercase">
                Women's Fashion
            </span>
            <div class="h-px w-8 bg-primary/20"></div>
        </div>
        <h1 class="text-3xl sm:text-4xl font-bold text-text-main tracking-tight">
            The Fashion Collection
        </h1>
        <p class="text-text-muted mt-3 max-w-lg text-sm sm:text-base leading-relaxed opacity-80">
            Dresses, shoes, and bags — curated for the modern Ethiopian woman.
        </p>
        <div class="w-12 h-1 bg-primary mt-6 rounded-full"></div>
    </div>

    <!-- Search and Sort Bar -->
    <div class="flex flex-col md:flex-row gap-4 mb-10 sticky top-16 z-30 bg-bg-main/90 backdrop-blur-md py-4 -mx-4 px-4 sm:mx-0 sm:px-0">
        <!-- Search Input -->
        <div class="flex-1 relative group">
            <input type="text" 
                   name="q"
                   id="search-input"
                   value="{{ search_query if search_query else '' }}"
                   placeholder="Search dresses, shoes, bags..." 
                   class="w-full pl-12 pr-4 py-3 bg-white border border-border-main rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm"
                   hx-get="/shop"
                   hx-trigger="keyup changed delay:500ms, search"
                   hx-target="#shop-content"
                   hx-swap="outerHTML"
                   hx-include="#sort-dropdown, #tag-input"
                   hx-push-url="true"
                   hx-indicator="#grid-indicator, #search-loading">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-text-muted">
                <!-- Static Icon -->
                <svg id="search-icon" class="w-5 h-5 opacity-40 group-focus-within:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            
            <!-- Loading Indicator -->
            <div id="search-loading" class="absolute right-4 top-1/2 -translate-y-1/2 htmx-indicator">
                <svg class="animate-spin h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
        
        <!-- Sort Dropdown -->
        <div class="w-full md:w-56 relative group">
            <select name="sort_by"
                    id="sort-dropdown"
                    class="w-full px-4 py-3 bg-white border border-border-main rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm appearance-none cursor-pointer pr-10"
                    hx-get="/shop"
                    hx-trigger="change"
                    hx-target="#shop-content"
                    hx-swap="outerHTML"
                    hx-include="#search-input, #tag-input"
                    hx-push-url="true"
                    hx-indicator="#grid-indicator, #search-loading">
                <option value="newest" {% if current_sort == 'newest' or not current_sort %}selected{% endif %}>Sort: Newest First</option>
                <option value="price-low" {% if current_sort == 'price-low' %}selected{% endif %}>Price: Low to High</option>
                <option value="price-high" {% if current_sort == 'price-high' %}selected{% endif %}>Price: High to Low</option>
                <option value="popular" {% if current_sort == 'popular' %}selected{% endif %}>Most Popular</option>
            </select>
            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-text-muted opacity-40 group-focus-within:opacity-100 transition-opacity">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>
    </div>

    <!-- Shop Content Container -->
    {% include "buyer/_shop_content.html" %}
</div>
{% endblock %}
